name: Release

# Push a tag like v1.2.3 to publish a release. A tag with a suffix
# (v1.3.0-rc.1) becomes a pre-release, which the in-app updater ignores.
on:
  push:
    tags: ['v*']
  # Run by hand: without a tag, a dry run that writes the notes for the
  # commits since the last tag into the job summary and changes nothing.
  # With a tag, it (re)writes the notes of that existing release.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release whose notes to rewrite, e.g. v0.1.0. Empty: dry run.'
        required: false
        default: ''

permissions:
  contents: write # create the release

env:
  WAILS_VERSION: v3.1.0

jobs:
  notes:
    name: Release notes
    runs-on: ubuntu-latest
    env:
      # Optional. With a token that may use GitHub Copilot, the notes are
      # written by AI from the commits since the last release. Without it,
      # the release gets GitHub's generated notes only. See README.
      COPILOT_PAT: ${{ secrets.COPILOT_PAT }}
      # The release the notes are for: the pushed tag, or the one named when
      # run by hand. Empty for a dry run, which looks at main.
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    outputs:
      body: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the previous tag and the commits since

      - name: Collect the changes since the previous release
        run: |
          end=${TAG:-HEAD}
          prev=$(git describe --tags --abbrev=0 "${end}^" 2>/dev/null || true)
          echo "PREV=$prev" >> "$GITHUB_ENV"
          {
            echo "Here are the commits of Picture-Frame-Control from ${prev:-the first version} to ${TAG:-today}."
            echo "Picture-Frame-Control is a Windows app that mirrors albums and tags from Immich onto Frameo picture frames."
            echo "Write release notes in English for its users:"
            echo "- sections \"## New\", \"## Improved\", \"## Fixed\" (level-2 headings), only those that have entries"
            echo "- one short sentence per item on what changes for users, no commit hashes"
            echo "- leave out internal changes (tests, workflows, refactoring) or sum them up in one sentence under \"Internal\""
            echo "- write in English even where a commit message is in another language"
            echo "- Markdown only, no introduction and no closing sentence"
            echo
            git log --no-merges --format='* %s%n%b' "${prev:+$prev..}${end}"
          } > prompt.txt

      - name: Install Copilot CLI
        if: env.COPILOT_PAT != ''
        run: npm install -g @github/copilot

      - name: Write the notes with AI
        id: ai
        if: env.COPILOT_PAT != ''
        continue-on-error: true # a failed AI step must not block the release
        uses: actions/ai-inference@v3
        with:
          prompt-file: prompt.txt
          system-prompt: You write concise, factual release notes in English. You add nothing that is not in the commits.
          # Empty lets the Copilot CLI choose; the action's default (gpt-4.1)
          # is no longer offered and fails with "Model is not available".
          model: ''
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}

      - name: Hand the notes to the release job
        id: notes
        env:
          RESPONSE_FILE: ${{ steps.ai.outputs.response-file }}
        run: |
          eof=NOTES_$(openssl rand -hex 8)
          {
            echo "body<<$eof"
            if [ -n "$RESPONSE_FILE" ] && [ -s "$RESPONSE_FILE" ]; then cat "$RESPONSE_FILE"; echo; fi
            echo "$eof"
          } >> "$GITHUB_OUTPUT"
          if [ -n "$RESPONSE_FILE" ] && [ -s "$RESPONSE_FILE" ]; then
            tee -a "$GITHUB_STEP_SUMMARY" < "$RESPONSE_FILE" # also into the log
          else
            echo "No AI notes; the release gets GitHub's generated notes." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Only when run by hand with a tag: replace that release's notes, keeping
      # the changelog link GitHub adds to new releases.
      - name: Rewrite the notes of the existing release
        if: github.event_name == 'workflow_dispatch' && env.TAG != '' && steps.ai.outputs.response-file != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RESPONSE_FILE: ${{ steps.ai.outputs.response-file }}
        run: |
          {
            cat "$RESPONSE_FILE"
            echo
            echo # a blank line, or the link joins the last list item
            if [ -n "$PREV" ]; then
              echo "**Full Changelog**: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$PREV...$TAG"
            else
              echo "**Full Changelog**: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commits/$TAG"
            fi
          } > notes.md
          gh release edit "$TAG" --notes-file notes.md

  release:
    name: Build & publish (windows)
    needs: notes
    if: github.event_name == 'push' # a dry run publishes nothing
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install wails3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # VERSION ends up in the binary (-X main.version) and in the window title.
      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
        run: wails3 build

      # The updater picks the asset whose name contains "windows" and "amd64"
      # and verifies it against SHA256SUMS.
      - name: Name and checksum
        shell: bash
        run: |
          mkdir dist
          cp bin/picture-frame-control.exe "dist/picture-frame-control_${GITHUB_REF_NAME#v}_windows_amd64.exe"
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ needs.notes.outputs.body }}
          generate_release_notes: true # appends the changelog link after the AI notes
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*
