name: go
version: 1.1.0
description: Use when the user writes, reviews, debugs, or refactors Go code — a `.go`
  file, `go.mod`, a Go package or web service, "golang", a goroutine or interface
  design question, or an error-handling decision. Not for Cobra/Viper CLI wiring (use
  cobra-viper), cutting a release (use go-release), reviewing a design doc or spec
  (use go-spec-reviewer), a Wails desktop app (use wails), or cross-filesystem moves
  and untrusted path segments (use fileflow-pathologize). Current through Go 1.27.
author: Steve Francia
license: MIT
repository: https://github.com/spf13/go-skills
homepage: https://github.com/spf13/go-skills
type: hybrid
