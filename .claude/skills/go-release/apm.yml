name: go-release
version: 1.1.0
description: Use when the user cuts, plans, or reviews a Go release — a version tag,
  semver, breaking-change detection, a v2 module path, deprecating an API, go.mod
  hygiene before tagging, a changelog, or shipping binaries with GoReleaser. Also
  use when an exported API change to a published module needs a patch, minor, or major
  decision. Not for general Go code (use go), CLI construction (use cobra-viper),
  or design-doc review (use go-spec-reviewer).
author: Steve Francia
license: MIT
repository: https://github.com/spf13/go-skills
homepage: https://github.com/spf13/go-skills
type: hybrid
