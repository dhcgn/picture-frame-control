name: cobra-viper
version: 1.1.0
description: Use when a Go CLI is built, reviewed, or refactored with Cobra and Viper
  — "cobra", "viper", a subcommand, a persistent or local flag, flag parsing, a viper
  config file, environment or flag binding, or a test that executes a `cobra.Command`.
  Not for general Go package design (use go), shipping a CLI binary (use go-release),
  or pre-implementation spec review (use go-spec-reviewer).
author: Steve Francia
license: MIT
repository: https://github.com/spf13/go-skills
homepage: https://github.com/spf13/go-skills
type: hybrid
